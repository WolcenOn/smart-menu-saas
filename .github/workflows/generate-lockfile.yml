name: Regenerate full lockfile with S3 dependencies
on:
  pull_request:
    paths:
      - .github/workflows/generate-lockfile.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Regenerate with complete npm resolution
        run: |
          rm -f package-lock.json
          npm install --no-fund
      - name: Commit lockfile to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate complete npm dependency lock"
            git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}
          fi
