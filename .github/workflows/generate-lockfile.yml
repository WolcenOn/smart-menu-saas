name: Generate current main npm lockfile
on:
  pull_request:
    paths:
      - .github/workflows/generate-lockfile.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate complete dependency tree
        run: npm install --no-fund
      - name: Commit lockfile for this PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock npm dependencies"
            git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}
          fi
